# The KB's frontmatter schema, from the para.kb KB type. It is this KB's own: change it to fit.
version: 2
strict: false
discriminator: type
common:
  type: {type: string, required: true, enum: [project, area, resource, note, about, kb]}
  status: {type: string, required: true}
  created: {type: date, required: true}
  tags: {type: list}
  abstract: {type: string}
  title: {type: string}
  updated: {type: date}
  sources: {type: list}
  related: {type: list}
types:
  project:
    status: {type: string, enum: [active, on-hold, done, archived]}
    due: {type: date}
    area: {type: string}
    outcome: {type: string}
  area:
    status: {type: string, enum: [active, archived]}
  resource:
    status: {type: string, enum: [active, archived]}
    topic: {type: string}
  note:
    status: {type: string, enum: [active, archived]}
  about:
    status: {type: string, enum: [active]}
    kb_type: {type: string}
    kb_type_url: {type: string}
    kb_type_commit: {type: string}
  kb:
    status: {type: string, enum: [active]}
    kind: {type: string, enum: [agents, rules, operations, readme, pointer]}
    autodoc_version: {type: string}
    revision: {type: integer}
